openapi: 3.1.0
info:
  title: Day 6 — SupTech Monitor API
  version: 0.1.0
  description: |
    Read-only supervisory monitoring and assistant endpoints for the Day 6
    training application. All data is synthetic training data. Authentication
    is a demo boundary; Production offers public one-click access as supervisor
    only. With explicit user confirmation, configured Groq calls receive the
    user's prompt and bounded synthetic aggregate context only; document text
    and row-level records are not sent. Vercel document uploads require
    persistent S3-compatible storage. This is not a real supervisory system
    and expresses no Bank of Tanzania policy; exceptions are review signals,
    never findings of misconduct or non-compliance.
servers:
  - url: http://127.0.0.1:3000
    description: Local development. Public deployment is synthetic-demo only.
tags:
  - name: auth
    description: Demo sign-in and sign-out.
  - name: overview
    description: Portfolio summary, trend and recent exceptions.
  - name: analytics
    description: Indicator catalog values and portfolio trend.
  - name: institutions
    description: Institution register and per-institution detail.
  - name: exceptions
    description: Supervisory exception register (review signals).
  - name: report-imports
    description: Synthetic CSV report preview, import and history.
  - name: assistant
    description: Page-contextual answers plus deterministic plan review and confirmed allowlisted read-only operations.
  - name: agents
    description: User-confirmed bounded prompts using Groq or a local LM Studio model.
security:
  - cookieAuth: []
paths:
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with the local demo identity
      security: []
      description: |
        Validates the env-configured demo credentials and issues the
        `suptech_demo_session` cookie (httpOnly, sameSite=strict, path=/,
        8-hour TTL, `secure` in production) via `Set-Cookie` on the 200
        response. Rate limited per username: 5 failed attempts within a
        5-minute window returns 429 with a `Retry-After` header (demo
        in-memory fixed window, not a production control).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: demo.supervisor
              password: value-from-local-.env
      responses:
        '200':
          description: Signed in. `Set-Cookie` establishes the demo session cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Body must be JSON with a username (1-100 chars) and password (1-200 chars).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthMisconfigured'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/demo-login:
    post:
      tags: [auth]
      operationId: oneClickDemoLogin
      summary: Create a one-click demo session
      security: []
      description: |
        Available only on Vercel Preview and Production deployments. Requires
        an exact same-origin `Origin` header. Production access is public and
        always issues the configured demo identity with the `supervisor` role;
        Preview uses the configured `DEMO_ROLE`. The successful sign-in is
        written to `audit_events`. This endpoint is for synthetic training
        data only and is not a production identity or authorization control.
      responses:
        '200':
          description: Signed in. `Set-Cookie` establishes the demo session cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '403':
          description: Missing or mismatched `Origin` header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not available outside Vercel Preview and Production.
        '503':
          $ref: '#/components/responses/AuthMisconfigured'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out and clear the demo session cookie
      security: []
      description: |
        Clears `suptech_demo_session` by returning an empty cookie with
        `max-age=0` via `Set-Cookie`. No session check is performed.
      responses:
        '200':
          description: Signed out. `Set-Cookie` clears the session cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/overview:
    get:
      tags: [overview]
      operationId: getOverview
      summary: Portfolio summary, 12-month trend and recent open exceptions
      description: |
        Defaults to the latest seeded period (`MAX(reporting_period)`) when
        no `period` is supplied. `openExceptions`, `criticalExceptions` and
        `recentExceptions` count exceptions with `status = 'open'` only
        (`under_review` and `resolved` are excluded), matching the register
        default. Returns empty structures when no data is seeded.
      parameters:
        - $ref: '#/components/parameters/PeriodParam'
      responses:
        '200':
          description: Overview for the resolved period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/analytics:
    get:
      tags: [analytics]
      operationId: getAnalytics
      summary: Indicator values for the selected period and portfolio trend
      description: |
        Indicator values come from sector-grain rollups
        (`grain='sector'`, `subject_key='SECTOR'`) and fall back to the
        average across institution grain when no sector row exists for the
        period. `indicator` filters the returned list; unknown ids are
        rejected with 400. The trend covers the last 12 periods up to the
        resolved period, ascending.
      parameters:
        - $ref: '#/components/parameters/PeriodParam'
        - name: indicator
          in: query
          required: false
          description: Restrict the response to a single catalog indicator.
          schema:
            type: string
            enum: [deposits, loans, loan_to_deposit, deposit_growth, loan_growth, capital_adequacy, npl_ratio, liquidity, completeness, quality_failure_rate, late_submission]
      responses:
        '200':
          description: Indicator values and portfolio trend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/institutions:
    get:
      tags: [institutions]
      operationId: listInstitutions
      summary: Paginated institution register
      description: |
        Filters combine with AND. `search` matches institution id or name
        (case-insensitive contains); `region` is an exact match. Each item
        carries the latest report snapshot and the count of open exceptions
        (`status = 'open'`).
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: region
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, monitoring]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: One page of the register.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/institutions/{institutionId}:
    get:
      tags: [institutions]
      operationId: getInstitutionDetail
      summary: Institution detail with recent reports and exceptions
      description: |
        Returns the institution snapshot, its 12 most recent reports
        (descending by period, with the source record ids that back each
        report) and its 20 most recent exceptions of any status.
      parameters:
        - name: institutionId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9-]{2,24}$'
          example: BTC-001
      responses:
        '200':
          description: Institution detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/exceptions:
    get:
      tags: [exceptions]
      operationId: listExceptions
      summary: Paginated exception register (review signals)
      description: |
        Returns exceptions of all statuses unless filtered; the dashboard
        register applies `status=open` as its default view. Filters combine
        with AND. `search` matches exception id, institution name or message.
        Results are ordered by severity rank, then period descending, then
        creation time descending.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: institutionId
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Za-z0-9-]{2,24}$'
        - $ref: '#/components/parameters/PeriodParam'
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [critical, high, medium, low]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, under_review, resolved]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: One page of the exception register.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/report-imports:
    get:
      tags: [report-imports]
      operationId: listReportImports
      summary: List report import batches
      description: Requires an authenticated demo session.
      responses:
        '200':
          description: Recent CSV import batches.
          content:
            application/json:
              schema:
                type: object
                required: [batches]
                properties:
                  batches:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportImportBatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [report-imports]
      operationId: processReportImport
      summary: Preview or import a synthetic CSV report file
      description: |
        Requires a supervisor or admin demo session and an exact same-origin
        `Origin` header. The uploader must explicitly confirm that the file
        contains synthetic training data only. Files are limited to 1 MB,
        500 data rows and 64 columns. Preview with `mode=preview`, review the
        field mapping and row-level results, then submit the same file with
        `mode=commit`. Existing institution/period reports are never
        overwritten; valid rows may be imported while invalid rows are
        recorded as rejected. Unmapped columns are retained as row metadata.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [mode, file, syntheticOnlyConfirmed]
              properties:
                mode:
                  type: string
                  enum: [preview, commit]
                file:
                  type: string
                  format: binary
                syntheticOnlyConfirmed:
                  type: string
                  enum: ['true']
                mapping:
                  type: string
                  description: Optional JSON object mapping report field names to exact CSV column names.
                  example: '{"institutionId":"Entity Code","period":"Month"}'
      responses:
        '200':
          description: Preview result when mode is preview.
          content:
            application/json:
              schema:
                type: object
                required: [preview]
                properties:
                  preview:
                    $ref: '#/components/schemas/ReportImportPreview'
        '201':
          description: Import result when mode is commit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Insufficient role or invalid request origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/assistant/plan:
    post:
      tags: [assistant]
      operationId: planAssistantQuestion
      summary: Create a deterministic read-only query plan
      description: |
        Does not execute a query. The planner supports a bounded set of
        overview, exception, institution and indicator questions; unsupported
        intents return 400. The client must show the plan and obtain explicit
        user confirmation before calling `/api/assistant/execute`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantPlanRequest'
      responses:
        '200':
          description: Proposed operation and confirmation text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantPlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/assistant/contextual-answer:
    post:
      tags: [assistant]
      operationId: answerContextualAssistantQuestion
      summary: Answer a question using the active page's synthetic aggregates
      description: |
        Requires a signed-in session, same-origin request and explicit
        confirmation that the question concerns synthetic training data only.
        The server derives bounded facts from the database using the supplied
        page and allowlisted filters; client-provided metric values are not
        accepted. A configured model receives the question and aggregate facts,
        never document text, source rows or institution/record identifiers.
        Responses are not cached or persisted and include fact citations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextualAssistantRequest'
      responses:
        '200':
          description: A grounded answer with page context, citations and provider mode.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always private, no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextualAssistantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Invalid request origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/assistant/execute:
    post:
      tags: [assistant]
      operationId: executeAssistantTool
      summary: Execute one allowlisted read-only operation
      description: |
        The client must call this only after the user confirms the displayed
        plan. Tool arguments are validated against the operation's allowlist;
        extra fields and arbitrary SQL are rejected. This endpoint never
        performs a write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantExecuteRequest'
      responses:
        '200':
          description: Structured tool result and evidence summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantExecuteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/orchestration:
    get:
      tags: [agents]
      operationId: listLocalAgents
      summary: List available local analysis roles
      responses:
        '200':
          description: Agent IDs and UI-safe descriptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [agents]
      operationId: runLocalAgents
      summary: Run a confirmed analysis workflow or selected agents
      description: |
        Requires explicit confirmation that the prompt concerns synthetic
        training data only. Direct mode accepts 1–10 unique roles and
        2–2,000 character prompts. Workflow mode accepts one question and
        optional period/institution scope. When Groq is configured, model
        context is limited to the prompt and bounded synthetic aggregates;
        source documents, raw rows and institution/record identifiers are
        not included. Local LM Studio is available for development.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunRequest'
      responses:
        '200':
          description: All selected agents completed successfully.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AgentRunResponse'
                  - $ref: '#/components/schemas/SupervisoryWorkflowResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: One or more direct agent model calls failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunResponse'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: suptech_demo_session
  parameters:
    PeriodParam:
      name: period
      in: query
      required: false
      description: Reporting month filter (YYYY-MM). Invalid formats are rejected with 400.
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 25
  headers:
    SetCookieSession:
      description: >-
        Sets (sign-in) or clears (sign-out) the `suptech_demo_session` cookie.
        Sign-in attributes: httpOnly, sameSite=strict, path=/, max-age=28800,
        secure in production. Sign-out: empty value with max-age=0.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying sign-in for that username.
      schema:
        type: string
        example: '60'
  responses:
    BadRequest:
      description: 'Validation failed (period format, unknown indicator, invalid filter or out-of-bounds pagination). Body is {"error": string}.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'Unauthenticated or incorrect demo credentials; body is {"error": string}.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'Resource not found; body is {"error": string}.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: 'Sign-in rate limited (5 failed attempts per username per 5 minutes, demo in-memory window); body is {"error": string}.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Request body exceeds the endpoint's byte limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthMisconfigured:
      description: 'Local demo auth is misconfigured (missing DEMO_USERNAME/DEMO_PASSWORD or AUTH_SECRET shorter than 32 characters); body is {"error": string}.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 'Unexpected failure; body is {"error": string} with a generic message that never exposes internals.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 200
    LoginResponse:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
        role:
          type: string
          enum: [viewer, supervisor, admin]
    LogoutResponse:
      type: object
      required: [signedOut]
      properties:
        signedOut:
          type: boolean
    AssistantToolName:
      type: string
      enum:
        - get_portfolio_overview
        - list_exceptions
        - get_institution
        - get_analytics
        - list_institutions
    AssistantPlanRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 2
          maxLength: 200
    ReportImportPreview:
      type: object
      required: [columns, mapping, suggestedMapping, missingFields, totalRows, acceptedRows, rejectedRows, additionalColumns, rows]
      properties:
        columns:
          type: array
          items:
            type: string
        mapping:
          type: object
          additionalProperties:
            type: string
        suggestedMapping:
          type: object
          additionalProperties:
            type: string
        missingFields:
          type: array
          items:
            type: string
        totalRows:
          type: integer
        acceptedRows:
          type: integer
        rejectedRows:
          type: integer
        additionalColumns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
            required: [rowNumber, institutionId, period, sourceRecordId, additionalFieldCount, status, errors]
            properties:
              rowNumber:
                type: integer
              institutionId:
                type: [string, 'null']
              period:
                type: [string, 'null']
              sourceRecordId:
                type: [string, 'null']
              additionalFieldCount:
                type: integer
              status:
                type: string
                enum: [ready, rejected]
              errors:
                type: array
                items:
                  type: string
    ReportImportBatch:
      type: object
      required: [batchId, filename, uploadedBy, status, totalRows, acceptedRows, rejectedRows, columns, mapping, checksum, createdAt]
      properties:
        batchId:
          type: string
          format: uuid
        filename:
          type: string
        uploadedBy:
          type: string
        status:
          type: string
          enum: [completed, completed_with_errors, rejected]
        totalRows:
          type: integer
        acceptedRows:
          type: integer
        rejectedRows:
          type: integer
        columns:
          type: array
          items:
            type: string
        mapping:
          type: object
          additionalProperties:
            type: string
        checksum:
          type: string
          pattern: '^[a-f0-9]{64}$'
        createdAt:
          type: string
          format: date-time
    ReportImportResult:
      type: object
      required: [batch, rows]
      properties:
        batch:
          $ref: '#/components/schemas/ReportImportBatch'
        rows:
          type: array
          items:
            type: object
            required: [rowNumber, sourceRecordId, institutionId, period, reportId, status, errors, additionalFieldCount]
            properties:
              rowNumber:
                type: integer
              sourceRecordId:
                type: string
              institutionId:
                type: [string, 'null']
              period:
                type: [string, 'null']
              reportId:
                type: [string, 'null']
              status:
                type: string
                enum: [accepted, rejected]
              errors:
                type: array
                items:
                  type: string
              additionalFieldCount:
                type: integer
    AssistantPlan:
      type: object
      required: [tool, arguments, purpose, source, confirmation]
      properties:
        tool:
          $ref: '#/components/schemas/AssistantToolName'
        arguments:
          type: object
          additionalProperties: true
        purpose:
          type: string
        source:
          type: string
        confirmation:
          type: string
    AssistantPlanResponse:
      type: object
      required: [plan]
      properties:
        plan:
          $ref: '#/components/schemas/AssistantPlan'
    AssistantExecuteRequest:
      type: object
      required: [tool, arguments]
      properties:
        tool:
          $ref: '#/components/schemas/AssistantToolName'
        arguments:
          type: object
          additionalProperties: true
    AssistantExecuteResponse:
      type: object
      required: [result]
      properties:
        result:
          type: object
          required: [tool, arguments, result, summary]
          properties:
            tool:
              $ref: '#/components/schemas/AssistantToolName'
            arguments:
              type: object
              additionalProperties: true
            result:
              type: object
              additionalProperties: true
            summary:
              type: string
    AgentId:
      type: string
      enum:
        - data-ingestion
        - prudential-analysis
        - exception-classifier
        - report-synthesizer
        - anomaly-detector
        - supervisor-router
        - institution-context
        - data-analyst
        - document-retrieval
        - exception-indicator
        - report-agent
        - verification-agent
        - response-composer
    AgentListResponse:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items:
            type: object
            required: [id, name, description]
            properties:
              id:
                $ref: '#/components/schemas/AgentId'
              name:
                type: string
              description:
                type: string
    AgentRunRequest:
      oneOf:
        - $ref: '#/components/schemas/AgentDirectRunRequest'
        - $ref: '#/components/schemas/SupervisoryWorkflowRequest'
    AgentDirectRunRequest:
      type: object
      required: [requests, syntheticOnlyConfirmed]
      properties:
        requests:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [agentId, userMessage]
            properties:
              agentId:
                $ref: '#/components/schemas/AgentId'
              userMessage:
                type: string
                minLength: 2
                maxLength: 2000
        parallel:
          type: boolean
          default: true
        syntheticOnlyConfirmed:
          type: boolean
          const: true
    SupervisoryWorkflowRequest:
      type: object
      required: [workflow, question, syntheticOnlyConfirmed]
      properties:
        workflow:
          type: boolean
          const: true
        question:
          type: string
          minLength: 2
          maxLength: 2000
        period:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        institutionId:
          type: string
          pattern: '^[A-Za-z0-9-]{2,24}$'
        syntheticOnlyConfirmed:
          type: boolean
          const: true
    AgentRunResponse:
      type: object
      required: [success, agents, totalLatencyMs]
      properties:
        success:
          type: boolean
        agents:
          type: array
          items:
            type: object
            required: [success, agentId, agentName]
            properties:
              success:
                type: boolean
              agentId:
                $ref: '#/components/schemas/AgentId'
              agentName:
                type: string
              response:
                type: string
              error:
                type: string
              latencyMs:
                type: number
                minimum: 0
        totalLatencyMs:
          type: number
          minimum: 0
        error:
          type: string
    SupervisoryWorkflowResponse:
      type: object
      required: [requestId, intent, scope, activeAgents, plan, verification, response, latencyMs, modelUsed, modelProvider, contextUsed]
      properties:
        requestId:
          type: string
        intent:
          type: string
        scope:
          type: object
          additionalProperties: true
        activeAgents:
          type: array
          items:
            type: string
        plan:
          type: object
          additionalProperties: true
        retrievedSources:
          type: array
          items:
            type: object
            additionalProperties: true
        analyticalResults:
          type: object
          additionalProperties: true
        verification:
          type: object
          additionalProperties: true
        response:
          type: object
          additionalProperties: true
        latencyMs:
          type: number
          minimum: 0
        modelUsed:
          type: string
          enum: [groq, local-qwen, deterministic-fallback]
        modelProvider:
          type: string
        contextUsed:
          type: boolean
    ContextualAssistantRequest:
      type: object
      required: [question, pathname, syntheticOnlyConfirmed]
      properties:
        question:
          type: string
          minLength: 2
          maxLength: 500
        pathname:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^/'
        filters:
          type: object
          additionalProperties: false
          properties:
            period:
              type: string
              maxLength: 100
            indicator:
              type: string
              maxLength: 100
            search:
              type: string
              maxLength: 100
            region:
              type: string
              maxLength: 100
            status:
              type: string
              maxLength: 100
            severity:
              type: string
              maxLength: 100
            institutionId:
              type: string
              maxLength: 100
        history:
          type: array
          maxItems: 2
          items:
            type: object
            required: [role, content]
            additionalProperties: false
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
                maxLength: 600
        syntheticOnlyConfirmed:
          type: boolean
          const: true
    ContextualAssistantFact:
      type: object
      required: [id, label, value]
      properties:
        id:
          type: string
        label:
          type: string
        value:
          type: string
    ContextualAssistantResponse:
      type: object
      required: [answer, citations, pageLabel, contextScope, period, provider, model, mode]
      properties:
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/ContextualAssistantFact'
        pageLabel:
          type: string
        contextScope:
          type: string
        period:
          type: [string, 'null']
        provider:
          type: string
          enum: [groq, lmstudio]
        model:
          type: string
        mode:
          type: string
          enum: [model, deterministic_fallback]
    Exception:
      type: object
      required: [id, institutionId, institutionName, reportId, period, indicatorId, observedValue, thresholdValue, severity, status, message, createdAt]
      properties:
        id:
          type: string
          description: 'Deterministic id: EXC-{threshold_id}-{institution_id}-{period}.'
        institutionId:
          type: string
        institutionName:
          type: string
        reportId:
          type: string
        period:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        indicatorId:
          type: string
        observedValue:
          type: number
        thresholdValue:
          type: number
        severity:
          type: string
          enum: [critical, high, medium, low]
        status:
          type: string
          enum: [open, under_review, resolved]
        message:
          type: string
        createdAt:
          type: string
          format: date-time
    OverviewSummary:
      type: object
      required: [institutions, reportsReceived, reportsExpected, openExceptions, criticalExceptions, depositsTzsBillions, loansTzsBillions, completenessPercent]
      properties:
        institutions:
          type: integer
        reportsReceived:
          type: integer
        reportsExpected:
          type: integer
        openExceptions:
          type: integer
          description: Exceptions with status = 'open' for the period.
        criticalExceptions:
          type: integer
          description: Exceptions with status = 'open' and severity 'critical' for the period.
        depositsTzsBillions:
          type: number
        loansTzsBillions:
          type: number
        completenessPercent:
          type: [number, 'null']
    OverviewTrendPoint:
      type: object
      required: [period, depositsTzsBillions, loansTzsBillions, completenessPercent, exceptions]
      properties:
        period:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        depositsTzsBillions:
          type: number
        loansTzsBillions:
          type: number
        completenessPercent:
          type: [number, 'null']
        exceptions:
          type: integer
          description: Open exceptions recorded for the period.
    OverviewResponse:
      type: object
      required: [period, summary, trend, recentExceptions]
      properties:
        period:
          type: [string, 'null']
          description: Resolved period (requested or latest), null when nothing is seeded.
        summary:
          $ref: '#/components/schemas/OverviewSummary'
        trend:
          type: array
          items:
            $ref: '#/components/schemas/OverviewTrendPoint'
        recentExceptions:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/Exception'
    IndicatorValue:
      type: object
      required: [id, label, unit, value, formula]
      properties:
        id:
          type: string
        label:
          type: string
        unit:
          type: string
          enum: ['TZS bn', '%', 'count']
        value:
          type: [number, 'null']
          description: Sector-grain rollup value, or the institution-grain average as fallback; null when no data.
        formula:
          type: string
    AnalyticsTrendPoint:
      type: object
      required: [period, deposits, loans, completeness]
      properties:
        period:
          type: string
        deposits:
          type: number
        loans:
          type: number
        completeness:
          type: [number, 'null']
    AnalyticsResponse:
      type: object
      required: [period, indicators, trend]
      properties:
        period:
          type: [string, 'null']
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/IndicatorValue'
        trend:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/AnalyticsTrendPoint'
    Institution:
      type: object
      required: [institutionId, name, type, region, tier, status, latestPeriod, depositsTzsBillions, capitalAdequacyRatioPercent, nplRatioPercent, openExceptions]
      properties:
        institutionId:
          type: string
        name:
          type: string
        type:
          type: string
        region:
          type: string
        tier:
          type: string
          enum: ['Tier 1', 'Tier 2', 'Tier 3']
        status:
          type: string
          enum: [active, monitoring]
        latestPeriod:
          type: [string, 'null']
        depositsTzsBillions:
          type: [number, 'null']
        capitalAdequacyRatioPercent:
          type: [number, 'null']
        nplRatioPercent:
          type: [number, 'null']
        openExceptions:
          type: integer
          description: Exceptions with status = 'open' for this institution.
    InstitutionPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Institution'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    InstitutionReport:
      type: object
      required: [reportId, period, depositsTzsBillions, loansTzsBillions, capitalAdequacyRatioPercent, liquidityRatioPercent, nplRatioPercent, completenessPercent, sourceRecordIds]
      properties:
        reportId:
          type: string
        period:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        depositsTzsBillions:
          type: number
        loansTzsBillions:
          type: number
        capitalAdequacyRatioPercent:
          type: number
        liquidityRatioPercent:
          type: number
        nplRatioPercent:
          type: number
        completenessPercent:
          type: number
        sourceRecordIds:
          type: array
          items:
            type: string
    InstitutionDetail:
      type: object
      required: [institution, reports, exceptions]
      properties:
        institution:
          $ref: '#/components/schemas/Institution'
        reports:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/InstitutionReport'
        exceptions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Exception'
    ExceptionPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Exception'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
